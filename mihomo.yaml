  - {name: Apple, <<: *S6, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/elevenx5566/rules/refs/heads/main/icons/mihomo/pure/corner/apple.png"}
  #未收录的国外域名的UDP出站需要本地fallback的DNS去查询，fallback查询使用默认代理查询，最终会返回默认代理节点地址查询的CDN，如果漏网之鱼结果和DNS解析使用的不一致，会造成CDN不匹配问题。所以保持和DNS查询使用的节点一致
